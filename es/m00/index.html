<title>Módulo 00 Orientación</title>

<style>
/* VOICE everyday learning: calm, clear, hands-on; channel brand leads (dark night + cyan from the course videos)
   IDEA a training case file: Faro's dossier, evidence on the desk, worksheets with hints and answers behind a flap
   PICTURE the course shield emblem whose outer ring fills as the learner completes activities
   COLOUR deep night ground, cyan accent, green for "checked", amber only for warnings
   TYPE Inter Tight for titles + Inter for text, JetBrains Mono only inside mock screens and timestamps
   LAYOUT laptop: title + progress left, emblem right, then full-width bands; phone: title, emblem, nav, bands stacked */
/* File: index.html - Module 00 interactive learning page (ES/EN). All learner content lives in the DATA object below. */
:root{color-scheme:light dark;
--bg:light-dark(#f3f6fa,#060a14);--bg2:light-dark(#e7edf5,#0a1222);--panel:light-dark(#ffffff,#0e1729);--line:light-dark(#d3dce8,#1f2c44);
--ink:light-dark(#0b1220,#e8eef6);--mut:light-dark(#4a5a70,#93a3b8);--cy:light-dark(#0e7490,#22d3ee);--cyb:light-dark(#cff3fa,#0b3141);
--gr:light-dark(#047857,#34d399);--grb:light-dark(#d5f5e8,#0b3127);--am:light-dark(#92400e,#fbbf24);--amb:light-dark(#fdf0d2,#33270b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Inter Tight",Inter,sans-serif;line-height:1.08;letter-spacing:-.02em;margin:0}
h1{font-size:clamp(34px,5vw,52px);text-wrap:balance}
h2{font-size:clamp(26px,3.2vw,36px);margin-bottom:8px}
h3{font-size:20px}
p{margin:8px 0}
.band{padding-block:clamp(28px,4vw,56px);padding-inline:max(5vw,16px)}
.wrap{max-width:1240px;margin:auto}
.alt{background:var(--bg2)}
.lead{color:var(--mut);max-width:68ch}
.top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:center}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;color:var(--mut);margin-bottom:18px}
.brand i{width:18px;height:18px;border:3px solid var(--cy);border-radius:5px;display:inline-block}
.meter{margin-top:22px;max-width:520px}
.meter .bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.meter .bar b{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--gr));transition:width .5s}
.meter ul{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:4px;font-size:15px}
.meter li::before{content:"○ ";color:var(--mut)}
.meter li.ok::before{content:"● ";color:var(--gr)}
.lang{display:flex;gap:6px;margin-top:18px}
button,.btn{font:600 15px Inter,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--cy)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
button.on,button.pri{background:var(--cy);color:var(--bg);border-color:var(--cy)}
.emb{position:relative;aspect-ratio:1;max-width:420px;width:100%;justify-self:center}
.emb svg{width:100%;height:100%}
.spin{transform-origin:200px 200px;animation:sp 40s linear infinite}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.meter .bar b{transition:none}}
@keyframes sp{to{transform:rotate(360deg)}}
nav.scroll{position:sticky;top:0;z-index:5;display:flex;gap:4px;overflow-x:auto;padding:8px max(5vw,16px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.scroll a{flex:none;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;padding:10px 12px;border-radius:8px}
nav.scroll a:hover{background:var(--cyb)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.note{font-size:14px;color:var(--mut)}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--cyb);color:var(--cy)}
.warn{background:var(--amb);color:var(--am);border-radius:10px;padding:10px 14px;font-size:15px}
.okm{background:var(--grb);color:var(--gr);border-radius:10px;padding:10px 14px;font-size:15px}
.err{border-left:3px solid var(--am);padding-left:12px;color:var(--mut);font-size:15px}
.err b{color:var(--am)}
.ppl{display:grid;gap:10px}
.ppl div{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--cyb);color:var(--cy)}
ol.rules{padding-left:20px;margin:6px 0}
.lessons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.lessons .card h3{margin:8px 0}
.ts{font:500 14px "JetBrains Mono",monospace;color:var(--cy)}
.steps{display:grid;gap:14px;counter-reset:s}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px}
.step::before{counter-increment:s;content:counter(s);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--cy);color:var(--bg)}
.screen{border-radius:16px;border:1px solid var(--line);background:#0b1220;color:#e2e8f0;padding:16px;font-size:15px;box-shadow:0 1px 0 var(--line)}
.screen .bar{font:500 13px "JetBrains Mono",monospace;color:#94a3b8;display:flex;justify-content:space-between;margin-bottom:12px}
.screen .big{font-weight:700;font-size:17px;color:#fff}
.screen .red{color:#fca5a5}
.screen .sms{background:#1e293b;border-radius:14px 14px 14px 4px;padding:12px 14px;margin-top:6px}
.screen .lnk{color:#7dd3fc;text-decoration:underline;overflow-wrap:anywhere}
.vt{width:100%;border-collapse:collapse;font-size:14px}
.vt td,.vt th{padding:8px;border-bottom:1px solid #243049;text-align:left}
.vt td.n{text-align:right;white-space:nowrap}
.vt tr.hl td{background:#0b3141}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.case{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;align-items:start}
@media(min-width:901px){.case>div:first-child{position:sticky;top:80px}}
.q{border-top:1px solid var(--line);padding:16px 0}
.q:first-child{border-top:0;padding-top:0}
.q label{font-weight:700;display:block;margin-bottom:6px}
textarea,input[type=text]{width:100%;font:16px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.reveal{margin-top:10px;display:grid;gap:8px}
.sort{display:grid;gap:10px}
.sort .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sort .fb{grid-column:1/-1;font-size:15px}
.sort .it.good{border-color:var(--gr)}
.sort .it.bad{border-color:var(--am)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--cy)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 14px;height:auto}
.opt.good{border-color:var(--gr);background:var(--grb)}
.opt.bad{border-color:var(--am);background:var(--amb)}
.scroll{overflow-x:auto}
table.map{width:100%;border-collapse:collapse}
table.map th,table.map td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
footer{color:var(--mut);font-size:14px}
@media(max-width:900px){.lessons,.grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.case{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.top,.grid2,.lessons,.grid3{grid-template-columns:minmax(0,1fr)}.emb{max-width:260px;order:-1}table.map{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px;border:0;padding:3px 0}.stack td::before{content:attr(data-l);font-weight:700}}
</style>
</head>

</div></header>

<section class="band" id="hechos"><div class="wrap">
 <h2>${t(FS.title)}</h2><p class="lead">${t(FS.lead)}</p>
 <div class="sort" style="margin-top:16px">${FS.items.map(([ans,txt,why],i)=>{const g=S.fs[i];const st=g?(g===ans?"good":"bad"):"";return `<div class="it ${st}"><span>${t(txt)}</span><span class="row" style="margin:0"><button data-fs="${i}" data-v="f" class="${g==="f"?"on":""}">${t(FS.f)}</button><button data-fs="${i}" data-v="a" class="${g==="a"?"on":""}">${t(FS.a)}</button></span>${g?`<span class="fb ${g===ans?"okm":"warn"}">${g===ans?"✓":"✗"} ${(ans==="f"?t(FS.f):t(FS.a))}. ${t(why)}</span>`:""}</div>`}).join("")}</div>
 ${S.done.fs?`<p class="okm" style="margin-top:12px">${t(FS.done)}</p>`:""}
</div></section>
<section class="band alt" id="lab-b"><div class="wrap">
 <h2>${t(B.title)}</h2><p class="lead">${t(B.lead)}</p>
 <div class="grid2" style="margin-top:16px">
  <div class="card"><h3>${t(B.exT)}</h3>${B.ex.map(([k,v])=>`<p><b>${t(k)}:</b> ${t(v)}</p>`).join("")}<p class="note">${t(B.why)}</p></div>
  <div class="card"><h3>${t(B.yourT)}</h3>${B.fields.map(([id,l,ph])=>`<div class="q"><label for="b_${id}">${t(l)}</label><input type="text" id="b_${id}" data-inp="b_${id}" placeholder="${esc(t(ph))}"></div>`).join("")}
   <div id="privMsg"></div>
   <h3 style="margin-top:14px">${t(B.rubT)}</h3>${B.rub.map((r,i)=>`<label class="chk"><input type="checkbox" id="rub${i}" data-rub="${i}" ${S.rub[i]?"checked":""}><span>${t(r)}</span></label>`).join("")}
   <div class="row"><button class="pri" id="bSave">${t(B.save)}</button><button id="bCopy">${t(B.copy)}</button></div><div id="bMsg" style="margin-top:10px">${S.done.lb?`<p class="okm">${t(B.saved)}</p>`:""}</div></div>
 </div></div></section>
<section class="band" id="quiz"><div class="wrap">
 <h2>${t(Q.title)}</h2><p class="lead">${t(Q.lead)}</p>
 <div class="grid2" style="margin-top:16px">${Q.qs.map(([q,opts,ok,why],i)=>{const a=S.quiz[i];return `<div class="card"><h3>${i+1}. ${t(q)}</h3>${opts.map((o,j)=>`<button class="opt ${a!==undefined&&j===ok?"good":""} ${a===j&&j!==ok?"bad":""}" data-q="${i}" data-o="${j}">${t(o)}</button>`).join("")}${a!==undefined?`<p class="note">${a===ok?"✓":"✗"} ${t(why)}</p>`:""}</div>`}).join("")}
 <div class="card" style="display:grid;place-items:center;text-align:center"><div><div class="note">${t(Q.score)}</div><div style="font:800 clamp(40px,6vw,64px) 'Inter Tight',sans-serif">${Object.keys(S.quiz).filter(i=>S.quiz[i]===Q.qs[i][2]).length}/${Q.qs.length}</div></div></div></div>
</div></section>
<section class="band alt" id="pro"><div class="wrap">
 <h2>${t(P.title)}</h2><p class="lead">${t(P.lead)}</p>
 <div class="scroll" style="margin-top:12px"><table class="map stack"><thead><tr>${P.head.map(h=>`<th>${t(h)}</th>`).join("")}</tr></thead><tbody>${P.rows.map(([a,b,c])=>`<tr><td data-l="${t(P.head[0])}"><b>${t(a)}</b></td><td data-l="${t(P.head[1])}">${t(b)}</td><td data-l="${t(P.head[2])}">${c}</td></tr>`).join("")}</tbody></table></div>
 <p class="okm" style="margin-top:14px">${t(P.ev)}</p>
</div></section>`;
 $("foot").textContent=t(DATA.foot);
 document.querySelectorAll("[data-inp]").forEach(el=>{el.value=S.inp[el.dataset.inp]||""});
 checkPriv();progress();addResets();
}
function caseDone(i){return DATA.labA.cases[i].steps.every((_,k)=>(S.rev[`a${i}_${k}`]||0)>=2)}
function progress(){
 S.done.la=[0,1,2].every(caseDone);
 S.done.fs=DATA.fs.items.every((x,i)=>S.fs[i]===x[0]);
 S.done.qz=Object.keys(S.quiz).length===DATA.quiz.qs.length;
 const ks=DATA.prog,n=ks.filter(([k])=>S.done[k]).length,p=n/ks.length;
 $("pbar").style.width=(p*100)+"%";
 $("plist").innerHTML=ks.map(([k,l])=>`<li class="${S.done[k]?"ok":""}">${t(l)}</li>`).join("");
 $("ring").setAttribute("stroke-dasharray",`${(p*1005.3).toFixed(1)} 1006`);$("ring").style.opacity=n?1:0;
 $("pct").textContent=`${n}/${ks.length} ${S.lang==="es"?"actividades":"activities"}`;
 save();
}
const PRIV=/\S+@\S+\.\S+|contrase(ñ|n)a\s*[:=]|password\s*[:=]|clave\s*[:=]|\d{8,}/i;
function checkPriv(){const bad=DATA.labB.fields.some(([id])=>PRIV.test(S.inp["b_"+id]||""));$("privMsg").innerHTML=bad?`<p class="warn">${t(DATA.labB.priv)}</p>`:"";return bad}
function answerText(){return DATA.labB.fields.map(([id,l])=>`${t(l)}: ${S.inp["b_"+id]||""}`).join("\n")}

/* ---------- events ---------- */
document.addEventListener("input",e=>{const k=e.target.dataset.inp;if(k){S.inp[k]=e.target.value;save();if(k.startsWith("b_"))checkPriv()}});
document.addEventListener("change",e=>{const r=e.target.dataset.rub;if(r!==undefined){S.rub[r]=e.target.checked;save()}});
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;const d=b.dataset,y=window.scrollY;
 if(b.id==="bES"||b.id==="bEN"){S.lang=b.id==="bES"?"es":"en";render();return}
 if(b.id==="exDone"){S.done.ex=true;rerender(b);return}
 if(d.case!==undefined){S.caseIx=+d.case;rerender(b);return}
 if(d.rev){S.rev[d.rev]=Math.max(S.rev[d.rev]||0,+d.lv);rerender(b);return}
 if(d.fs!==undefined){S.fs[d.fs]=d.v;rerender(b);return}
 if(d.q!==undefined){if(S.quiz[d.q]===undefined){S.quiz[d.q]=+d.o;rerender(b)}return}
 if(b.id==="bSave"){const full=DATA.labB.fields.every(([id])=>(S.inp["b_"+id]||"").trim())&&DATA.labB.rub.every((_,i)=>S.rub[i]);
  if(checkPriv())return;
  if(!full){$("bMsg").innerHTML=`<p class="warn">${t(DATA.labB.need)}</p>`;return}
  S.done.lb=true;progress();$("bMsg").innerHTML=`<p class="okm">${t(DATA.labB.saved)}</p>`;return}
 if(b.id==="bCopy"){const m=$("bMsg");try{navigator.clipboard.writeText(answerText()).then(()=>{m.innerHTML=`<p class="okm">${t(DATA.labB.copied)}</p>`},()=>{})}catch(err){}return}
});

const RESET_AT=[["lab-a","labA","lab"],["hechos","fs","ex"],["lab-b","labB","lab"],["quiz","quiz","quiz"]];
const RESETS={labA:()=>clearKeys(/^a\d_/),fs:()=>{S.fs={}},labB:()=>{clearKeys(/^b_/);S.rub={};S.done.lb=false},quiz:()=>{S.quiz={}}};

/* patch:v1 */
const Lx=(es,en)=>({es,en});
const L10N={reset:Lx("Reiniciar progreso","Reset progress"),sure:Lx("¿Seguro? Pulsa otra vez","Sure? Click again"),
 lab:Lx("Reiniciar este laboratorio","Reset this lab"),ex:Lx("Reiniciar ejercicio","Reset exercise"),quiz:Lx("Repetir autoevaluación","Retake self-check"),
 done:Lx("Listo: se borraron tus respuestas de esta sección.","Done: your answers for this section were cleared.")};
const clearKeys=re=>{for(const o of [S.inp,S.rev])for(const k of Object.keys(o))if(re.test(k))delete o[k]};
function anchorKey(b){if(b.id)return "#"+b.id;const d=b.dataset;return Object.keys(d).filter(k=>k!=="armed").map(k=>`[data-${k.replace(/[A-Z]/g,m=>"-"+m.toLowerCase())}="${d[k]}"]`).join("")||null}
function rerender(b){const key=anchorKey(b),top=b.getBoundingClientRect().top;render();const nb=key&&document.querySelector(key);if(nb){window.scrollBy(0,nb.getBoundingClientRect().top-top);try{nb.focus({preventScroll:true})}catch(e){}}}
function addResets(){
 const m=document.querySelector(".meter");
 if(m&&!document.getElementById("resetAll")){const b=document.createElement("button");b.id="resetAll";b.style.marginTop="12px";m.appendChild(b)}
 const ra=document.getElementById("resetAll");if(ra&&!ra.dataset.armed)ra.textContent=t(L10N.reset);
 for(const [sec,key,label] of RESET_AT){const w=document.querySelector(`#${sec} .wrap`);if(!w)continue;
  const r=document.createElement("div");r.className="row";r.style.marginTop="16px";
  r.innerHTML=`<button data-reset="${key}">${t(L10N[label])}</button>`;w.appendChild(r)}
 document.querySelectorAll('a[href^="http"]').forEach(a=>{a.target="_blank";a.rel="noopener"});
}
function arm(b,run){if(b.dataset.armed){delete b.dataset.armed;run();return}
 b.dataset.armed="1";b.textContent=t(L10N.sure);setTimeout(()=>{if(b.dataset.armed){delete b.dataset.armed;b.textContent=b.id==="resetAll"?t(L10N.reset):t(L10N[RESET_AT.find(x=>x[1]===b.dataset.reset)[2]])}},4000)}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.id==="resetAll"){e.stopImmediatePropagation();arm(b,()=>{const lang=S.lang;S={lang,done:{},inp:{},rev:{},fs:{},quiz:{},rub:{},caseIx:0};save();render();window.scrollTo(0,0)});return}
 if(b.dataset.reset){e.stopImmediatePropagation();const k=b.dataset.reset;arm(b,()=>{RESETS[k]();save();render();
  const nb=document.querySelector(`[data-reset="${k}"]`);if(nb){nb.insertAdjacentHTML("afterend",`<span class="note" role="status">${t(L10N.done)}</span>`);nb.scrollIntoView({block:"center"})}});return}
},true);
render();
}
</script>
</body>
</html>
